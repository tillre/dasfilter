events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}
worker_rlimit_nofile 8192;

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  proxy_cache_path /var/cache/nginx/dasfilter levels=1:2 keys_zone=dasfilter:10m max_size=2g inactive=120m use_temp_path=off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  types_hash_max_size 2048;
  server_tokens off;

  client_max_body_size 20m;
  client_body_buffer_size 128k;
  client_body_timeout 30;
  client_header_timeout 30;
  keepalive_timeout 30;
  send_timeout 30;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # upstream timeouts: fail fast instead of hanging clients for 60s
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;

  map $http_x_forwarded_proto $df_proto {
    default $scheme;
  }

  # crawlers and bots are kept out of /preview/ (see nginx-locations.conf)
  map $http_user_agent $is_bot {
    default 0;
    "~*(bot|crawl|spider|slurp|archiver|scraper|fetch|curl|wget|python|java|go-http|headless|facebookexternalhit|gptbot|claudebot|ccbot|anthropic|openai|bytespider|petalbot|semrush|ahrefs|mj12)" 1;
    "" 1;
  }

  # HSTS only on HTTPS responses (empty value = header not sent)
  map $scheme $hsts {
    https   "max-age=86400";
    default "";
  }

  server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
    }

    # everything else goes to HTTPS (cert issued 2026-10-27, see conf.d/ssl.conf)
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server: enabled once a certificate exists (see config/nginx-ssl.conf)
  include /etc/nginx/conf.d/*.conf;
}
