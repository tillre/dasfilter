# shared proxy locations for the http and https servers

location / {
  access_log off;

  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Host $http_host;
  proxy_set_header   Connection "";
  proxy_ignore_headers X-Accel-Expires Expires Cache-Control;

  # rewrite plain-http asset/embed URLs so pages also work over HTTPS
  # (static.dasfilter.com is an S3 website bucket without TLS; the path-style
  #  S3 endpoint serves the same files over HTTPS)
  proxy_set_header   Accept-Encoding "";
  sub_filter_once off;
  sub_filter_types application/rss+xml;
  sub_filter 'src="http://static.dasfilter.com/' 'src="https://s3.eu-west-1.amazonaws.com/static.dasfilter.com/';
  sub_filter 'data-src="http://static.dasfilter.com/' 'data-src="https://s3.eu-west-1.amazonaws.com/static.dasfilter.com/';
  sub_filter 'href="http://static.dasfilter.com/' 'href="https://s3.eu-west-1.amazonaws.com/static.dasfilter.com/';
  sub_filter 'content="http://static.dasfilter.com/' 'content="https://s3.eu-west-1.amazonaws.com/static.dasfilter.com/';
  sub_filter 'url>http://static.dasfilter.com/' 'url>https://s3.eu-west-1.amazonaws.com/static.dasfilter.com/';
  sub_filter 'src="http://' 'src="https://';

  proxy_cache dasfilter;
  proxy_cache_valid 200 301 302 60s;
  proxy_cache_revalidate on;
  proxy_cache_min_uses 1;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_cache_lock on;
  proxy_cache_lock_age 10s;
  add_header X-Cache-Status $upstream_cache_status;
  add_header Strict-Transport-Security $hsts always;   # location-level add_header drops the server-level one

  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_pass http://app:8080;
}

location /admin {
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Host $http_host;
  proxy_set_header   Connection "";
  access_log off;
  expires off;
  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_pass http://app:8080$request_uri;
}

location /api {
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   Host $http_host;
  proxy_set_header   Connection "";
  access_log off;
  expires off;
  client_max_body_size 100m;
  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_pass http://app:8080$request_uri;
}
