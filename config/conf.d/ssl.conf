# Copied to config/conf.d/ssl.conf once /etc/letsencrypt/live/dasfilter.com exists.
server {
  listen 443 ssl;
  http2 on;
  server_name dasfilter.com www.dasfilter.com dasfilter.net www.dasfilter.net das-filter.net www.das-filter.net dasfilter.org www.dasfilter.org;

  ssl_certificate     /etc/letsencrypt/live/dasfilter.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dasfilter.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=86400" always;

  include /etc/nginx/dasfilter-locations.conf;
}
